---
deployment:
  tasks:
    - export DEPLOYPATH=/home/travelce/public_html/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /bin/rsync -av --delete \
      --exclude='.git/' \
      --exclude='.github/' \
      --exclude='.cpanel.yml' \
      --exclude='ftp-simple-temp.json' \
      --exclude='error_log' \
      --exclude='admin/error_log' \
      ./ "$DEPLOYPATH"
